# Tooling configuration for the SoundManager project.
#
# This file holds only [tool.*] tables — there is intentionally no [project] or
# [build-system] table. The macOS app is built via `python setup.py py2app`
# (see CLAUDE.md); that flow is unaffected by this file. Note that the mere
# presence of pyproject.toml makes PEP 517 frontends (`pip install .`) treat the
# project as setuptools-backed; that install path is not used or supported here
# (development uses ./run.sh, builds use setup.py).

[tool.ruff]
target-version = "py313"
line-length = 88
# Only "build" needs adding — ruff already excludes venv/ and dist/ by default.
# py2app emits build/ artifacts we don't want to lint.
extend-exclude = ["build"]

[tool.ruff.lint]
# A pragmatic starter set: pyflakes/pycodestyle correctness (E, F, W),
# import sorting (I), bugbear (B), comprehension (C4), pyupgrade (UP) and a
# few flake8-simplify (SIM) rules. E501 is deliberately omitted: line length
# is enforced by the formatter, which can't split unbreakable lines (long
# strings/URLs), so linting it too just produces unfixable noise.
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Characterization tests intentionally assert against a broad Exception to
# pin current behavior without over-specifying the exception type.
"tests/*" = ["B017"]

[tool.mypy]
# Advisory only for now: run in CI but non-blocking. The codebase has ~200
# pre-existing type findings (mostly Optional/None-guard union-attr in the
# audio layer); tighten these incrementally rather than gating the build.
python_version = "3.13"
files = ["app"]
ignore_missing_imports = true   # python-vlc / mutagen ship no type stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
