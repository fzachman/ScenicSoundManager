name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repo to lint/test. Setting it here
# overrides any permissive repo default and denies the GITHUB_TOKEN everything
# else (write contents, packages, releases, PR writes, ...).
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # PyQt6 runs headless in CI; conftest.py also sets this, but exporting it
      # here covers any direct interpreter invocation too.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries (libvlc + headless Qt)
        run: |
          sudo apt-get update
          # libvlc-dev pulls the libvlc/libvlccore runtime so `import vlc`
          # succeeds (otherwise the VLC-dependent tests are skipped). The
          # remaining packages are what Qt's offscreen platform plugin needs.
          sudo apt-get install -y --no-install-recommends \
            libvlc-dev \
            vlc-plugin-base \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight — headless deps must actually load
        # Fail loudly here rather than letting a broken libvlc/Qt install
        # silently skip the VLC-guarded tests (skipif vlc is None) and the
        # offscreen QApplication, leaving CI deceptively green.
        run: |
          python -c "from app.audio.engine import VLC_AVAILABLE; assert VLC_AVAILABLE, 'libvlc failed to import — VLC-guarded tests would silently skip'"
          python -c "from PyQt6.QtWidgets import QApplication; QApplication([])"

      - name: Ruff lint
        run: ruff check --output-format=github

      - name: Ruff format check
        run: ruff format --check

      - name: Mypy (advisory, non-blocking)
        continue-on-error: true
        run: mypy

      - name: Run tests
        run: pytest
